# CharterSplit — STANDALONE режим (чистый сервер, свой nginx + Let's Encrypt).
# Использовать ВМЕСТО docker-compose.yml, когда на сервере нет reverse-proxy:
#   docker compose -f docker-compose.standalone.yml up -d
#
# Предусловия: DNS A-запись ${DOMAIN} → IP сервера; открыты порты 80/443.
# Первый запуск рекомендуется с CERTBOT_STAGING=1 (в .env), затем переключить на 0.
#
# В этом режиме Mini App отдаётся в корне домена (basePath пустой).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      INIT_DATA_EXPIRES_IN: ${INIT_DATA_EXPIRES_IN:-3600}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      PUBLIC_URL: https://${DOMAIN}
      PORT: '3000'
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_PATH: ''
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - ./certbot/entrypoint.sh:/entrypoint.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  pgdata:
  certbot_conf:
  certbot_www:
