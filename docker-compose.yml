# CharterSplit — развёртывание за уже работающим reverse-proxy (Caddy, Traefik, nginx…).
#   docker compose up -d
#
# Стек не публикует порты: backend и frontend подключаются к внешней docker-сети
# ${PROXY_NETWORK} (по умолчанию `proxy`), в которой живёт ваш reverse-proxy, и он
# ходит к ним по имени контейнера. TLS и маршрутизация — на стороне прокси:
#   <PUBLIC_URL>/api/*  → chartersplit-backend:3000 (префикс /api срезается)
#   <PUBLIC_URL>/*      → chartersplit-frontend:3000
# Пример конфигурации Caddy — в README. Без внешнего прокси используйте
# docker-compose.standalone.yml (свой nginx + Let's Encrypt).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18+ хранит данные в /var/lib/postgresql/<major>; монтировать
      # нужно родительский каталог (см. docker-library/postgres#1259)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  backend:
    build:
      context: ./backend
    container_name: chartersplit-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      INIT_DATA_EXPIRES_IN: ${INIT_DATA_EXPIRES_IN:-3600}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      PUBLIC_URL: ${PUBLIC_URL}
      PORT: '3000'
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - default
      - proxy
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    container_name: chartersplit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH:-}/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - proxy
    logging: *logging

volumes:
  pgdata:

networks:
  # Внутренняя сеть стека (db <-> backend).
  default:
  # Внешняя сеть reverse-proxy. Создаётся один раз: docker network create proxy
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
